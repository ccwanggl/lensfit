, {"source": "README", "target": "10-concepts/hyperspectral-imaging"}, {"source": "README", "target": "10-concepts/spectral-power-distribution"}, {"source": "README", "target": "10-concepts/fluorescence"}, {"source": "README", "target": "10-concepts/raman-scattering"}, {"source": "README", "target": "10-concepts/全局快门"}, {"source": "README", "target": "10-concepts/卷帘快门"}, {"source": "README", "target": "40-devices/telecentric-lens"}, {"source": "README", "target": "30-domains/README"}, {"source": "README", "target": "90-maps/Visual Index"}, {"source": "README", "target": "50-learning/05-matching-basics"}, {"source": "README", "target": "50-learning/04-sensors"}, {"source": "README", "target": "40-devices/README"}, {"source": "README", "target": "50-learning/03-lens-parameters"}, {"source": "README", "target": "50-learning/05-matching-basics"}, {"source": "README", "target": "90-maps/Visual Index"}]};
    const folderColors = {"00-inbox": "#9ca3af", "10-concepts": "#4ade80", "20-formulas": "#60a5fa", "30-domains": "#f87171", "40-devices": "#fbbf24", "50-learning": "#a78bfa", "80-sources": "#f472b6", "90-maps": "#22d3ee", "README.md": "#e5e7eb", "plan.md": "#e5e7eb"};

    const width = document.getElementById('graph').clientWidth;
    const height = document.getElementById('graph').clientHeight;

    const svg = d3.select('#graph').append('svg')
      .attr('viewBox', [0, 0, width, height]);

    const g = svg.append('g');

    const zoom = d3.zoom()
      .scaleExtent([0.1, 4])
      .on('zoom', (event) => g.attr('transform', event.transform));
    svg.call(zoom);

    const simulation = d3.forceSimulation(data.nodes)
      .force('link', d3.forceLink(data.links).id(d => d.id).distance(80))
      .force('charge', d3.forceManyBody().strength(-120))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force('collide', d3.forceCollide().radius(12));

    const link = g.append('g').attr('class', 'links')
      .selectAll('line')
      .data(data.links)
      .join('line')
      .attr('class', 'link')
      .attr('stroke-width', 1);

    const node = g.append('g').attr('class', 'nodes')
      .selectAll('g')
      .data(data.nodes)
      .join('g')
      .attr('class', 'node')
      .call(d3.drag()
        .on('start', dragstarted)
        .on('drag', dragged)
        .on('end', dragended));

    node.append('circle')
      .attr('r', d => d.folder === '50-learning' || d.folder === '90-maps' ? 8 : 5)
      .attr('fill', d => folderColors[d.folder] || '#94a3b8');

    let labelsVisible = true;
    const labels = node.append('text')
      .attr('dx', 10)
      .attr('dy', 3)
      .text(d => d.title);

    node.on('click', (event, d) => showInfo(d));

    simulation.on('tick', () => {
      link
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    }
    function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }

    function showInfo(d) {
      const incoming = data.links.filter(l => l.target.id === d.id).map(l => l.source.title);
      const outgoing = data.links.filter(l => l.source.id === d.id).map(l => l.target.title);
      const incomingHtml = incoming.length ? '<ul>' + incoming.slice(0, 20).map(t => `<li>${t}</li>`).join('') + (incoming.length > 20 ? '<li>...</li>' : '') + '</ul>' : '<p class="stat">无</p>';
      const outgoingHtml = outgoing.length ? '<ul>' + outgoing.slice(0, 20).map(t => `<li>${t}</li>`).join('') + (outgoing.length > 20 ? '<li>...</li>' : '') + '</ul>' : '<p class="stat">无</p>';
      document.getElementById('info').innerHTML = `
        <h2>${d.title}</h2>
        <p class="stat">文件夹：${d.folder} · 状态：${d.status}</p>
        <h3>入链 (${incoming.length})</h3>${incomingHtml}
        <h3>出链 (${outgoing.length})</h3>${outgoingHtml}
        <p><a href="${d.path}" target="_blank">在 Obsidian 中打开</a></p>
      `;
      // Highlight neighbors
      node.selectAll('circle').attr('opacity', n => (n.id === d.id || incoming.includes(n.title) || outgoing.includes(n.title)) ? 1 : 0.2);
      link.attr('stroke-opacity', l => (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.05);
    }

    // Legend
    const legend = document.getElementById('legend');
    Object.entries(folderColors).forEach(([folder, color]) => {
      if (data.nodes.some(n => n.folder === folder)) {
        legend.innerHTML += `<span><span class="dot" style="background:${color}"></span>${folder}</span>`;
      }
    });

    // Search
    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      node.attr('opacity', d => d.title.toLowerCase().includes(term) ? 1 : 0.1);
      link.attr('stroke-opacity', term ? 0.05 : 0.5);
    });

    function resetZoom() {
      svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
    }
    function toggleLabels() {
      labelsVisible = !labelsVisible;
      labels.attr('display', labelsVisible ? 'block' : 'none');
    }
  </script>
